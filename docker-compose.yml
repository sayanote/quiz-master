services:
  quiz-manager:
    container_name: quiz-manager
    build:
      context: ./manager
    env_file:
      - .env.local
    environment:
      DB_HOST: quiz-manager-db
      DB_PORT: ${DB_PORT} # Internal postgres port
    ports:
      - "${QUIZ_MANAGER_PORT}:8000"
    depends_on:
      quiz-manager-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "uv run python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8000/admin/\")'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  quiz-manager-db:
    image: postgres:18
    container_name: quiz-manager-db
    env_file:
      - .env.local
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - quiz-manager-db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${DB_USER} -d $${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # =================================
  # Quiz Master main server (backend)
  # =================================
  backend:
    container_name: quiz-master-backend
    build:
      context: ./backend
    env_file:
      - .env.local
    ports:
      - "${BACKEND_PORT}:4000"
    environment:
      # Quiz Master Serevr
      PORT: 4000
      # Quiz Manager Server
      QUIZ_MANAGER_HOST: quiz-manager
      QUIZ_MANAGER_PORT: 8000
    depends_on:
      quiz-manager:
        condition: service_healthy
    
volumes:
  quiz-manager-db-data:
